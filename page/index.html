<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Daily brief</title>
<script>
/* ── Your settings ───────────────────────────────────────────────────────────────────
   timeZone    the clock, "today", the greeting and the calendar use it (an IANA name)
   latitude,   roughly where you live: sunrise and sunset decide when the morning,
   longitude   evening and night backgrounds show
   background  'photos'  the seeded photos; the daytime one is alive (clouds, water, sheep)
               'ink'     painted landscapes, no photos and no animation
   inboxes     how each inbox is labelled; set one to null to hide it (Outlook → brief/outlook,
               Gmail → brief/gmail, as the scheduled task writes them)
   scene       optional: the numbers that belong to your own daytime photo, once you
               bring it to life (see background/README.md). Leave it out for the sheep. */
window.BRIEF_CONFIG = {
  timeZone: 'Europe/Amsterdam',
  latitude: 52.37,
  longitude: 4.90,
  background: 'photos',
  inboxes: {
    work:     { label: 'Work',     account: 'Outlook' },
    personal: { label: 'Personal', account: 'Gmail' }
  }
};
</script>
<script>
/* Background set and time of day (see BRIEF_CONFIG above) */
(function(){
  var CFG = window.BRIEF_CONFIG || {}, SC0 = CFG.scene || {};
  var BG_SET = window.__BG_SET_OVERRIDE || CFG.background || 'photos';
  var SETS = {
    photos: {
      dawn:    {src:'photo-day.jpg',     pos:SC0.position ? (SC0.position[0]*100)+'% '+(SC0.position[1]*100)+'%' : '50% 58%', tone:'smoke'},
      evening: {src:'photo-evening.jpg', pos:'50% 50%', tone:'smoke'},
      night:   {src:'photo-night.jpg',   pos:'40% 64%', tone:'smoke'}
    },
    ink: {
      dawn:    {src:'ink-dawn.jpg',    pos:'72% 50%', tone:'light'},
      evening: {src:'ink-evening.jpg', pos:'72% 50%', tone:'smoke'},
      night:   {src:'ink-night.jpg',   pos:'72% 50%', tone:'dark'}
    }
  };
  /* Sunrise and sunset where you live (standard solar formulas) */
  var LAT=+(CFG.latitude!=null?CFG.latitude:52.37), LON=+(CFG.longitude!=null?CFG.longitude:4.90), rad=Math.PI/180, dayMs=864e5, J1970=2440588, J2000=2451545, ecl=rad*23.4397, J0=0.0009;
  function sunTimes(date){
    var lw=rad*-LON, phi=rad*LAT, d=date.valueOf()/dayMs-0.5+J1970-J2000,
        n=Math.round(d-J0-lw/(2*Math.PI)), ds=J0+lw/(2*Math.PI)+n,
        m=rad*(357.5291+0.98560028*ds), C=rad*(1.9148*Math.sin(m)+0.02*Math.sin(2*m)+0.0003*Math.sin(3*m)),
        l=m+C+rad*102.9372+Math.PI, dc=Math.asin(Math.sin(ecl)*Math.sin(l)),
        Jnoon=J2000+ds+0.0053*Math.sin(m)-0.0069*Math.sin(2*l),
        w=Math.acos((Math.sin(rad*-0.833)-Math.sin(phi)*Math.sin(dc))/(Math.cos(phi)*Math.cos(dc))),
        a=J0+(w+lw)/(2*Math.PI)+n, Jset=J2000+a+0.0053*Math.sin(m)-0.0069*Math.sin(2*l), Jrise=Jnoon-(Jset-Jnoon);
    return {rise:(Jrise+0.5-J1970)*dayMs, set:(Jset+0.5-J1970)*dayMs};
  }
  var TZ0 = CFG.timeZone || 'Europe/Amsterdam';
  var ymdF = new Intl.DateTimeFormat('en-CA',{timeZone:TZ0,year:'numeric',month:'2-digit',day:'2-digit'});
  function sceneAt(now){
    try{
      var p=ymdF.format(now).split('-').map(Number), t=sunTimes(new Date(Date.UTC(p[0],p[1]-1,p[2],12))), ms=now.getTime(), H=36e5;
      if(!isFinite(t.rise)||!isFinite(t.set)) throw 0;
      if(ms<t.rise-H || ms>=t.set+1.5*H) return 'night';   /* from 90 min after sunset until an hour before sunrise */
      if(ms>=t.set-H) return 'evening';                      /* the hour before sunset until 90 min after */
      return 'dawn';                                         /* morning and daytime */
    }catch(e){
      var h=+new Intl.DateTimeFormat('en-GB',{timeZone:TZ0,hour:'numeric',hourCycle:'h23'}).format(now);
      return h>=6&&h<17?'dawn':h>=17&&h<20?'evening':'night';
    }
  }
  var s=sceneAt(new Date()), cfg=SETS[BG_SET][s], r=document.documentElement;
  r.setAttribute('data-scene',s); r.setAttribute('data-tone',cfg.tone);
  try{ new Image().src=cfg.src; }catch(e){}
  window.BRIEF={BG_SET:BG_SET, SETS:SETS, sceneAt:sceneAt};
})();
</script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Display","Inter","Segoe UI",system-ui,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter Display","Inter",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.36,.52,1);
  --ease:cubic-bezier(.2,.8,.2,1);

  /* Light tone: dark text on clear frosted glass */
  color-scheme:light;
  --base:#e9ebee;
  --label:#111214;--label2:rgba(17,18,20,.76);--label3:rgba(17,18,20,.62);--inv:#fff;
  --sep:rgba(17,18,20,.1);
  --fill:rgba(17,18,20,.06);--fill2:rgba(17,18,20,.12);
  --bar:rgba(17,18,20,.62);--bar-past:rgba(17,18,20,.2);
  --red:#d4574e;--live:#3d9467;--live-ring:rgba(61,148,103,.5);
  --g-a:rgba(255,255,255,.34);--g-b:rgba(255,255,255,.13);
  --g-edge:rgba(255,255,255,.55);--g-hi:rgba(255,255,255,.95);--g-bevel:rgba(255,255,255,.55);--g-lo:rgba(255,255,255,.3);
  --g-blur:blur(16px) saturate(120%) brightness(1.07);
  --g-shadow:0 1px 1px rgba(10,14,20,.04),0 16px 36px -16px rgba(10,14,20,.3);
  --rim-a:rgba(255,255,255,1);--rim-b:rgba(255,255,255,.75);
  --nav-a:rgba(255,255,255,.3);--nav-b:rgba(255,255,255,.08);
  --nav-blur:blur(7px) saturate(140%) brightness(1.1);
  --nav-shadow:0 16px 36px -14px rgba(10,14,20,.38),0 2px 8px rgba(10,14,20,.08);
  --lens-a:rgba(255,255,255,.82);--lens-b:rgba(255,255,255,.34);
  --chip-a:rgba(255,255,255,.66);--chip-b:rgba(255,255,255,.26);--chip-hi:rgba(255,255,255,.95);--chip-edge:rgba(255,255,255,.6);
  --chip-shadow:0 1px 2px rgba(10,14,20,.08),0 4px 10px -6px rgba(10,14,20,.25);
  --edge:rgba(225,228,232,.3);
  --clock-a:rgba(17,18,20,.92);--clock-b:rgba(17,18,20,.66);--clock-shadow:0 1px 0 rgba(255,255,255,.5);
  --hero-shadow:none;
  --solid-card:#f7f7f8;--solid-nav:#fbfbfc;
}
/* Dark tone: white text on faint glass over a dark scene */
:root[data-tone="dark"]{
  color-scheme:dark;
  --base:#0d0f12;
  --label:#f5f5f7;--label2:rgba(245,245,247,.72);--label3:rgba(245,245,247,.54);--inv:#111214;
  --sep:rgba(255,255,255,.11);
  --fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.13);
  --bar:rgba(255,255,255,.75);--bar-past:rgba(255,255,255,.25);
  --red:#ff7b72;--live:#6fd39a;--live-ring:rgba(111,211,154,.5);
  --g-a:rgba(255,255,255,.12);--g-b:rgba(255,255,255,.035);
  --g-edge:rgba(255,255,255,.16);--g-hi:rgba(255,255,255,.34);--g-bevel:rgba(255,255,255,.14);--g-lo:rgba(255,255,255,.07);
  --g-blur:blur(18px) saturate(130%);
  --g-shadow:0 1px 1px rgba(0,0,0,.3),0 18px 42px -16px rgba(0,0,0,.8);
  --rim-a:rgba(255,255,255,.55);--rim-b:rgba(255,255,255,.18);
  --nav-a:rgba(255,255,255,.14);--nav-b:rgba(255,255,255,.04);
  --nav-blur:blur(9px) saturate(150%) brightness(1.05);
  --nav-shadow:0 18px 44px -14px rgba(0,0,0,.85),0 3px 10px rgba(0,0,0,.4);
  --lens-a:rgba(255,255,255,.26);--lens-b:rgba(255,255,255,.07);
  --chip-a:rgba(255,255,255,.16);--chip-b:rgba(255,255,255,.05);--chip-hi:rgba(255,255,255,.3);--chip-edge:rgba(255,255,255,.12);
  --chip-shadow:0 1px 2px rgba(0,0,0,.35),0 4px 10px -6px rgba(0,0,0,.6);
  --edge:rgba(13,15,18,.35);
  --clock-a:rgba(255,255,255,.97);--clock-b:rgba(255,255,255,.66);--clock-shadow:0 2px 14px rgba(0,0,0,.3);
  --hero-shadow:0 1px 10px rgba(0,0,0,.3);
  --solid-card:#1c1c1e;--solid-nav:#2c2c2e;
}
/* Smoke tone: white text on smoked glass, for photos and bright, busy scenes */
:root[data-tone="smoke"]{
  color-scheme:dark;
  --base:#15171b;
  --label:#fff;--label2:rgba(255,255,255,.84);--label3:rgba(255,255,255,.68);--inv:#111214;
  --sep:rgba(255,255,255,.16);
  --fill:rgba(255,255,255,.1);--fill2:rgba(255,255,255,.18);
  --bar:rgba(255,255,255,.85);--bar-past:rgba(255,255,255,.3);
  --red:#ff8a80;--live:#7be0a5;--live-ring:rgba(123,224,165,.55);
  --g-a:rgba(14,18,24,.44);--g-b:rgba(14,18,24,.3);
  --g-edge:rgba(255,255,255,.22);--g-hi:rgba(255,255,255,.38);--g-bevel:rgba(255,255,255,.16);--g-lo:rgba(255,255,255,.08);
  --g-blur:blur(22px) saturate(150%) brightness(.82);
  --g-shadow:0 1px 1px rgba(0,0,0,.2),0 18px 40px -16px rgba(0,0,0,.55);
  --rim-a:rgba(255,255,255,.62);--rim-b:rgba(255,255,255,.2);
  --nav-a:rgba(14,18,24,.34);--nav-b:rgba(14,18,24,.2);
  --nav-blur:blur(12px) saturate(160%) brightness(.9);
  --nav-shadow:0 16px 38px -14px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.25);
  --lens-a:rgba(255,255,255,.3);--lens-b:rgba(255,255,255,.1);
  --chip-a:rgba(255,255,255,.2);--chip-b:rgba(255,255,255,.08);--chip-hi:rgba(255,255,255,.35);--chip-edge:rgba(255,255,255,.16);
  --chip-shadow:0 1px 2px rgba(0,0,0,.3),0 4px 10px -6px rgba(0,0,0,.5);
  --edge:rgba(0,0,0,.22);
  --clock-a:rgba(255,255,255,.98);--clock-b:rgba(255,255,255,.8);--clock-shadow:0 2px 18px rgba(0,0,0,.45);
  --hero-shadow:0 1px 2px rgba(0,0,0,.4),0 2px 20px rgba(0,0,0,.4);
  --solid-card:#1c1c1e;--solid-nav:#2c2c2e;
}

*{box-sizing:border-box}
html{background:var(--base)}
body{margin:0;color:var(--label);font:400 15px/1.4 var(--font);letter-spacing:-.012em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* The picture the glass sits on: one layer per time of day, cross-fading */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--base);overflow:hidden}
.ambient i{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;background-position:50% 50%;opacity:0;transition:opacity 2.4s var(--ease)}
.ambient i.on{opacity:1}
.ambient canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.6s var(--ease)}
.ambient canvas.on{opacity:1}
/* Tap the clock to look at the view: the cards step aside, the hero and the tab bar stay */
.clock[role=button]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.clock[role=button]:focus-visible{outline:2px solid var(--label);outline-offset:6px;border-radius:10px}
#main>*{transition:opacity .55s var(--ease),transform .55s var(--ease)}
body.viewing #main>*:not(.hero-h){opacity:0;transform:translateY(10px);pointer-events:none}
body.viewing .edge{opacity:0}

.wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 124px) calc(env(safe-area-inset-left) + 16px)}

/* Hero: date, live clock, greeting */
.hero-h{text-shadow:var(--hero-shadow);margin-bottom:22px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--label2)}
.clock{display:block;width:max-content;font:600 76px/1 var(--font-round);letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin:6px 0 10px;text-shadow:none;
  background:linear-gradient(180deg,var(--clock-a),var(--clock-b));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(var(--clock-shadow))}
h1{font:700 26px/1.2 var(--font-display);letter-spacing:-.024em;margin:0 0 3px}
.summary{font-size:17px;line-height:1.35;color:var(--label2);margin:0;letter-spacing:-.022em}

/* Glass panels: clear, lightly frosted, bevelled edge that catches the light */
.card{position:relative;border-radius:26px;overflow:hidden;
  background:linear-gradient(150deg,var(--g-a),var(--g-b));
  -webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);
  box-shadow:inset 0 0 0 1px var(--g-edge),inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),
    inset 0 24px 30px -30px var(--g-bevel),inset 0 -20px 28px -28px var(--g-lo),var(--g-shadow)}
.card::after,.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,var(--rim-a),rgba(255,255,255,.2) 22%,rgba(255,255,255,0) 48%,rgba(255,255,255,.08) 74%,var(--rim-b));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

.top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:30px}
.top .next{grid-column:1/-1}

.next{padding:17px 18px 18px}
.next-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.kicker{display:inline-flex;align-items:center;gap:7px;color:var(--label);text-transform:uppercase;letter-spacing:.04em}
.kicker.quiet{color:var(--label2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.kicker.live .dot{background:var(--live);animation:pulse 2.2s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--live-ring)}100%{box-shadow:0 0 0 9px rgba(0,0,0,0)}}
.when{margin-left:auto;color:var(--label2);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.next-title{font:600 22px/1.22 var(--font-display);letter-spacing:-.024em;margin:10px 0 4px}
.next-meta{color:var(--label2);font-size:14px}
.progress{height:4px;border-radius:2px;background:var(--fill2);margin-top:14px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--label);border-radius:inherit;transition:width .6s var(--ease)}
.then{margin-top:14px;padding-top:12px;font-size:13px;color:var(--label2);position:relative}
.then::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;transform:scaleY(.5);transform-origin:0 0;background:var(--sep)}
.then b{color:var(--label);font-weight:600}

.stat{padding:14px 15px 15px;min-height:108px;display:flex;flex-direction:column}
.stat .num{font:600 30px/1 var(--font-round);letter-spacing:-.02em;margin-top:auto;padding-top:12px;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:13px;font-weight:600;margin-top:4px;color:var(--label2)}

/* Small glass pieces: icon tiles, buttons, badges, chips */
.tile,.ico,.btn,.badge,.chip{background:linear-gradient(180deg,var(--chip-a),var(--chip-b));box-shadow:inset 0 1px 0 var(--chip-hi),inset 0 0 0 .5px var(--chip-edge),var(--chip-shadow)}
.tile{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--label)}
.tile svg.i{width:18px;height:18px;stroke-width:2}
.tile.strong{background:var(--label);color:var(--inv);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--chip-shadow)}
.tile.ph{background:var(--fill);box-shadow:none}
.ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--label)}
.ico svg.i{width:17px;height:17px;stroke-width:2}
.btn{display:inline-flex;align-items:center;gap:2px;align-self:center;font-size:13px;font-weight:600;color:var(--label);padding:6px 10px 6px 12px;border-radius:999px;text-decoration:none;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:transform .35s var(--spring)}
.btn svg.i{width:14px;height:14px;stroke-width:2.2}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.92)}
.btn:focus-visible{outline:2px solid var(--label);outline-offset:2px}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:1;padding:4px 9px;border-radius:999px;color:var(--label2)}
.badge.tent{background:transparent;box-shadow:inset 0 0 0 1px var(--label3)}
.badge.now{color:var(--label)}
.badge.now::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);margin-right:6px}
.chip{font-size:13px;font-weight:500;color:var(--label2);border-radius:999px;padding:5px 11px}
.chip b{color:var(--label);font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
/* Data view: the raw database entries */
.dv{display:grid;gap:14px}
.dv-h{position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px 10px}
.dv-h code{font:600 13px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0}
.dv-h .stamp{margin-left:auto}
.dv-json{margin:0;padding:2px 16px 16px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0;white-space:pre-wrap;word-break:break-word;color:var(--label2)}
.dv-json .k{color:var(--label);font-weight:600}.dv-json .n{color:var(--label)}
.dv-empty{padding:0 16px 16px;font-size:14px;color:var(--label2)}
/* Inbox blocks: one card per account, grouped inside */
.grp{position:relative;padding:13px 16px 0;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label3)}
.grp:not(:first-child)::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;transform:scaleY(.5);transform-origin:0 0;background:var(--sep)}
.grp+.row{padding-top:9px}
.grp+.chips{padding-top:9px}
.acct{display:inline-flex;align-items:center;vertical-align:3px;margin-left:8px;font:600 12px/1 var(--font);letter-spacing:0;padding:5px 9px;border-radius:999px;color:var(--label);text-shadow:none;
  background:linear-gradient(150deg,var(--g-a),var(--g-b));-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);
  box-shadow:inset 0 0 0 1px var(--g-edge),inset 0 1px 0 var(--g-hi)}

/* Sections */
.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 10px;text-shadow:var(--hero-shadow)}
.sec-h h2{font:600 20px/1.2 var(--font-display);letter-spacing:-.022em;margin:0}
.stamp{font-size:13px;color:var(--label3);white-space:nowrap;font-variant-numeric:tabular-nums}
.stamp.stale{color:var(--label);font-weight:600}
.day-h{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--label2);margin:18px 4px 8px;text-shadow:var(--hero-shadow)}
.day-h.first{margin-top:0}

/* Rows */
.row{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:13px 16px}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:62px;height:1px;transform:scaleY(.5);transform-origin:0 0;background:var(--sep)}
.row.calm{align-items:center}
.r-title{font-weight:600;font-size:15px;line-height:1.3;letter-spacing:-.016em}
.r-sub{color:var(--label2);font-size:14px;margin-top:2px}
.r-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:7px;font-size:13px;color:var(--label3)}
.deadline{display:flex;gap:5px;align-items:flex-start;margin-top:7px;font-size:13px;font-weight:600;color:var(--label)}
.deadline svg.i{width:15px;height:15px;margin-top:1px;stroke-width:2}

/* Calls */
.call{position:relative;display:grid;grid-template-columns:46px 3px minmax(0,1fr);gap:12px;padding:12px 16px}
.call+.call::before{content:"";position:absolute;top:0;right:0;left:74px;height:1px;transform:scaleY(.5);transform-origin:0 0;background:var(--sep)}
.c-time{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.c-time small{display:block;font-size:13px;font-weight:400;color:var(--label3)}
.c-bar{border-radius:2px;background:var(--bar);min-height:38px}
.call.past{opacity:.5}
.call.past .c-bar{background:var(--bar-past)}
.call.now .c-bar{background:var(--live)}
.call.tent .c-bar{background:repeating-linear-gradient(180deg,var(--bar) 0 5px,transparent 5px 9px)}
.c-title{font-weight:600;font-size:15px;line-height:1.3;letter-spacing:-.016em}
.c-who{font-size:14px;color:var(--label2);margin-top:2px}
.c-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.overlap{display:flex;gap:5px;align-items:center;font-size:13px;font-weight:600;color:var(--label);margin-top:7px}
.overlap svg.i{width:15px;height:15px;stroke-width:2}
.nowline{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:center;padding:0 16px;height:20px}
.nowline b{font-size:12px;font-weight:600;color:var(--red);font-variant-numeric:tabular-nums}
.nowline i{position:relative;height:1.5px;border-radius:1px;background:var(--red)}
.nowline i::before{content:"";position:absolute;left:-2.5px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--red)}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.empty{padding:15px 16px;color:var(--label2);font-size:14px}
.banner{margin-bottom:16px}
.foot{text-align:center;font-size:12px;color:var(--label3);margin:4px 0 0;text-shadow:var(--hero-shadow)}
/* Text sitting directly on a photo: near-white so it holds up over bright sky */
:root[data-tone="smoke"] .eyebrow,:root[data-tone="smoke"] .summary,:root[data-tone="smoke"] .sec-h .stamp,
:root[data-tone="smoke"] .day-h,:root[data-tone="smoke"] .foot{color:rgba(255,255,255,.95)}

.skel{display:block;height:11px;border-radius:6px;background:linear-gradient(90deg,var(--fill) 30%,var(--fill2) 50%,var(--fill) 70%) 0 0/200% 100%;animation:shimmer 1.6s linear infinite}
.skel+.skel{margin-top:9px}
.skel.w40{width:40%}.skel.w60{width:60%}.skel.w80{width:80%}.skel.num{height:26px;width:34px;margin-top:auto}
@keyframes shimmer{to{background-position:-200% 0}}

/* Navigation glass: the clearest layer, floating above everything */
.glass{
  background:linear-gradient(180deg,var(--nav-a),var(--nav-b));
  -webkit-backdrop-filter:var(--nav-blur);backdrop-filter:var(--nav-blur);
  box-shadow:inset 0 0 0 1px var(--g-edge),inset 0 1.5px 0 var(--g-hi),inset 0 -1px 1.5px var(--g-lo),var(--nav-shadow)}
.tabbar{position:fixed;z-index:30;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);display:flex;padding:5px;border-radius:999px}
.tabbar button{position:relative;z-index:1;appearance:none;border:0;background:none;font:inherit;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:2px;width:88px;padding:7px 0 6px;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .4s var(--spring),color .25s}
.tabbar button span{font-size:10.5px;font-weight:600;letter-spacing:.005em}
.tabbar button svg.i{width:24px;height:24px}
.tabbar button[aria-selected="true"]{color:var(--label)}
.tabbar button:active{transform:scale(.92)}
.tabbar button:focus-visible{outline:2px solid var(--label);outline-offset:-2px}
.lens{position:absolute;top:5px;bottom:5px;left:0;width:88px;border-radius:999px;
  background:radial-gradient(120% 160% at 50% 0%,var(--lens-a),var(--lens-b));
  box-shadow:inset 0 1px 0 var(--chip-hi),inset 0 -1px 1px var(--g-lo),inset 0 0 0 .5px var(--chip-edge),0 3px 12px -4px rgba(10,14,20,.25);
  transition:transform .55s var(--spring),width .55s var(--spring),scale .3s var(--ease)}
.lens.moving{scale:1.07 .94}
.lens.instant{transition:none}

/* Scroll edge: content softens as it slides under the glass */
.edge{position:fixed;left:0;right:0;z-index:20;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.edge.t{top:0;height:calc(env(safe-area-inset-top) + 34px);background:linear-gradient(var(--edge),transparent);-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
.edge.b{bottom:0;height:calc(env(safe-area-inset-bottom) + 100px);background:linear-gradient(transparent,var(--edge));-webkit-mask-image:linear-gradient(transparent,#000 65%);mask-image:linear-gradient(transparent,#000 65%)}

/* Motion: each surface animates itself, so its glass keeps sampling the picture */
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.anim .hero-h,.anim .card,.anim .sec-h,.anim .day-h{animation:rise .65s var(--ease) both}

/* Wide screens: iPad/Mac pattern, tab bar floats at the top */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (min-width:900px){
  .wrap{max-width:1060px;padding:96px 32px 56px}
  .clock{font-size:96px}
  h1{font-size:30px}
  .top{grid-template-columns:minmax(0,1.75fr) repeat(3,minmax(0,1fr));gap:14px}
  .top .next{grid-column:auto}
  .tabbar{top:18px;bottom:auto}
  .tabbar button{flex-direction:row;gap:7px;width:auto;padding:9px 18px}
  .tabbar button span{font-size:14px;letter-spacing:-.01em}
  .tabbar button svg.i{width:19px;height:19px}
  .edge.t{height:96px}
  .edge.b{display:none}
}

/* Accessibility fallbacks */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glass{background:var(--solid-nav)}
  .card{background:var(--solid-card)}
  .edge{display:none}
}
/* Tappable tiles and the summary link */
button.card{appearance:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent;transition:transform .35s var(--spring)}
button.card:active{transform:scale(.96)}
button.card:focus-visible{outline:2px solid var(--label);outline-offset:3px}
.stat .go{position:absolute;top:13px;right:13px;width:16px;height:16px;color:var(--label3)}
.stat .go svg.i{width:16px;height:16px;stroke-width:2.2}
.sum-link{appearance:none;border:0;background:none;font:inherit;color:var(--label);font-weight:600;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--label3);text-underline-offset:3px;text-shadow:inherit;-webkit-tap-highlight-color:transparent}
.sum-link:focus-visible{outline:2px solid var(--label);outline-offset:3px;border-radius:4px}

/* Inbox sections fold open and closed (remembered per inbox) */
.ib-head{margin:0;font:inherit;min-width:0;flex:1}
.ib-toggle{appearance:none;border:0;background:none;color:inherit;font:600 20px/1.2 var(--font-display);letter-spacing:-.022em;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:2px 0;margin:-2px 0;cursor:pointer;text-align:left;min-width:0;max-width:100%;text-shadow:inherit;-webkit-tap-highlight-color:transparent}
.ib-toggle:focus-visible{outline:2px solid var(--label);outline-offset:4px;border-radius:8px}
.ib-toggle .acct{margin-left:2px}
.ib-toggle .chev{width:18px;height:18px;flex:none;stroke-width:2.4;transition:transform .35s var(--spring)}
.ib.closed .ib-toggle .chev{transform:rotate(-90deg)}
.ib-sum{flex-basis:100%;padding-left:26px;font:500 13.5px/1.3 var(--font);letter-spacing:0;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ib-sum b{color:var(--label);font-weight:600}
.ib:not(.closed) .ib-sum{display:none}
.ib-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .4s var(--ease)}
.ib.closed .ib-body{grid-template-rows:0fr}
.ib-in{overflow:hidden;min-height:0}
.ib.closed .ib-in>.card{visibility:hidden;transition:visibility 0s .4s}
.ib.closed .sec-h .stamp{display:none}
.ib.closed{margin-bottom:18px}

/* "Needs you" sheet: slides up on the phone, floats in the middle on a wide screen */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.sheet-scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .3s var(--ease)}
.sheet{position:relative;width:min(620px,100%);max-height:min(84vh,780px);display:flex;flex-direction:column;border-radius:30px 30px 0 0;
  padding:8px 0 calc(env(safe-area-inset-bottom) + 10px);transform:translateY(102%);transition:transform .45s var(--spring);

.sheet-wrap.open .sheet{transform:none}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--label3);margin:4px auto 4px;opacity:.7}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px 6px 20px}
.sheet-h h2{font:700 24px/1.2 var(--font-display);letter-spacing:-.024em;margin:0}
.sheet-h h2 small{font:600 15px/1 var(--font);color:var(--label2);margin-left:8px;letter-spacing:0}
.sheet-x{appearance:none;border:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--label);cursor:pointer;font:inherit;
  background:linear-gradient(180deg,var(--chip-a),var(--chip-b));box-shadow:inset 0 1px 0 var(--chip-hi),inset 0 0 0 .5px var(--chip-edge),var(--chip-shadow)}
.sheet-x svg.i{width:16px;height:16px;stroke-width:2.4}
.sheet-x:focus-visible{outline:2px solid var(--label);outline-offset:2px}
.sheet-b{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 4px 8px}
.sheet-b .grp:first-child{padding-top:8px}
.sheet-b .grp .acct{margin-left:6px;vertical-align:0}
.sheet-f{display:flex;justify-content:center;padding:10px 16px 4px}
@media (min-width:900px){
  .sheet-wrap{align-items:center}
  .sheet{border-radius:28px;max-height:min(78vh,760px);padding-bottom:12px;transform:translateY(18px) scale(.97);opacity:0;transition:transform .4s var(--spring),opacity .25s var(--ease);box-shadow:inset 0 0 0 1px var(--g-edge),inset 0 1px 0 var(--g-hi),0 30px 80px -24px rgba(0,0,0,.6)}
  .sheet-wrap.open .sheet{opacity:1}
  .sheet-grab{display:none}
}
html.locked,html.locked body{overflow:hidden}

@media (prefers-reduced-transparency:reduce){
  .sheet{background:var(--solid-card);-webkit-backdrop-filter:none;backdrop-filter:none}
  .glass{background:var(--solid-nav);-webkit-backdrop-filter:none;backdrop-filter:none}
  .card{background:var(--solid-card);-webkit-backdrop-filter:none;backdrop-filter:none}
  .edge{display:none}
}

  skyRows: [1242, 1736],                 // image rows covered by sky-matte.png (the exact skyline)
  cloudSpeed: 9, wrap: 360,              // cloud drift (image px per second) and the width of the wrap blend
  clean: [1230, 2262, 1180, 94],         // flock-clean.png: grass painted over the real flock (x, y, w, h), or null
  sheep: true, sheepCount: 10,           // our own sheep, wandering the field below

  camera: {f: 2184, cx: 1512, horizon: 2182, groundScale: 9479},   // ground plane -> photo (pinhole camera)

'precision highp float;',
'uniform sampler2D uSrc,uPatchTex;uniform vec2 uSrcSize;',
'uniform float uAxis,uS,uO,uRow0,uLo,uHi,uPatch;uniform vec4 uPR;',
'float L(float x){x=abs(x);if(x<1e-4)return 1.0;if(x>=3.0)return 0.0;float p=3.14159265*x;return 3.0*sin(p)*sin(p/3.0)/(p*p);}',

'precision highp float;',
'uniform sampler2D uPhoto,uOrig,uMask,uDepth,uSky,uMatte,uRidge,uFill;',
'uniform vec2 uRes;uniform float uS;uniform vec2 uOff;uniform vec4 uTex,uSkyT,uMatT;uniform vec2 uBand;uniform vec2 uImg;',

'   +texture2D(tx,vec2(t0.x,t12.y))*w0.x*w12.y+texture2D(tx,vec2(t12.x,t12.y))*w12.x*w12.y+texture2D(tx,vec2(t3.x,t12.y))*w3.x*w12.y',
'   +texture2D(tx,vec2(t0.x,t3.y))*w0.x*w3.y+texture2D(tx,vec2(t12.x,t3.y))*w12.x*w3.y+texture2D(tx,vec2(t3.x,t3.y))*w3.x*w3.y;',

'vec3 base(vec2 c,bool sharp){vec2 uv=(c-uTex.xy)/uTex.zw;',
'  if(uFlockOn>0.5){return sharp?cr(uOrig,c-uTex.xy,uTex.zw).rgb:texture2D(uOrig,uv).rgb;}',
'  return sharp?cr(uPhoto,c-uTex.xy,uTex.zw).rgb:texture2D(uPhoto,uv).rgb;}',
'float h12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}',
'float vn(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);',
'  return mix(mix(h12(i),h12(i+vec2(1.0,0.0)),u.x),mix(h12(i+vec2(0.0,1.0)),h12(i+vec2(1.0,1.0)),u.x),u.y);}',

'float matteAt(vec2 ip){vec2 c=ip*uS+uOff;if(c.y<uBand.x)return 1.0;if(c.y>=uBand.y)return 0.0;return texture2D(uMatte,(vec2(ip.x*uS+uOff.x,c.y)-uMatT.xy)/uMatT.zw).r;}',
'vec3 skyRaw(float x,float y){',
'  float m=smoothstep(0.6,1.0,matteAt(vec2(x,y)))*smoothstep(6.0,10.0,ridgeAt(x)-y);',
'  vec3 fl=texture2D(uFill,vec2(x/uImg.x,(y-uFillY.x)/uFillY.y)).rgb;',
'  return m>0.999?skyPx(vec2(x,y)):mix(fl,skyPx(vec2(x,y)),m);}',
'vec3 skyAt(vec2 ip){float P=uImg.x+uWrap;float x=mod(ip.x,P);if(x<uImg.x)return skyRaw(x,ip.y);',
'  float u=x-uImg.x;float k=smoothstep(0.0,1.0,u/uWrap);return mix(skyRaw(uImg.x-1.0-u,ip.y),skyRaw(uWrap-u,ip.y),k);}',

'  vec2 sc=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);',
'  if(uOrigOn>0.5){gl_FragColor=vec4(texture2D(uOrig,(sc-uTex.xy)/uTex.zw).rgb,1.0);return;}',
'  vec2 p=(sc-uOff)/uS;',
'  float edge=smoothstep(0.0,80.0,min(min(p.x,uImg.x-p.x),min(p.y,uImg.y-p.y)));',
'  vec2 q=p;',
'  if(uAmp.w>0.001){for(int i=0;i<2;i++){float d=texture2D(uDepth,q/uImg).r;q=p-(uPar.xy+(q-uFocus)*uPar.z)*d*edge*uAmp.w;}}',
'  vec3 mk=texture2D(uMask,q/uImg).rgb;',
'  float wat=mk.g*uAmp.y,grs=mk.b*uAmp.z;',
'  vec2 disp=vec2(0.0);float sheen=0.0,spark=0.0;',

  const inboxes=[IB.work&&LD.outlook&&state.outlook,IB.personal&&LD.gmail&&g].filter(Boolean);
  if(inboxes.length){const k=inboxes.reduce((a,d)=>a+arr(d.needYou).length,0);parts.push(k?{t:`${k} ${plural(k,'thing needs','things need')} you`,open:true}:{t:'nothing needs you'})}
  if(parts.length)parts[0].t=parts[0].t.charAt(0).toUpperCase()+parts[0].t.slice(1);
  const s=parts.length?parts.map(p=>p.open?`<button class="sum-link" data-open="needs">${esc(p.t)}</button>`:esc(p.t)).join(' · ')
    :esc(ready?'Your brief fills in after the morning refresh':'Loading your day…');
  return `<header class="hero-h"><div class="eyebrow">${esc(fLong.format(now))} · Week ${isoWeek(today)}</div>
    <time class="clock" role="button" tabindex="0" aria-pressed="${viewing}" title="${viewing?'Back to the brief':'Show the view'}" datetime="${esc(today)}T${esc(nowHM)}">${esc(nowHM)}</time>
    <h1>${greet}</h1><p class="summary">${s}</p></header>`;
}

function banner(g,c){
  let t='';
  if(state.error)t=state.error;
  else if(state.timedOut)t=(g||c)?'Still connecting, so this may be out of date.':'Your brief can’t be reached yet. It will appear here as soon as it loads.';
  return t?`<div class="card banner"><div class="row calm"><span class="tile strong">${svg('exclaim')}</span><div class="r-sub">${esc(t)}</div><span></span></div></div>`:'';
}

function nextWidget(c,today,nowMin){
  if(!LD.calendar)return `<div class="card next"><span class="skel w40"></span><span class="skel w80"></span><span class="skel w60"></span></div>`;
  if(!c)return `<div class="card next"><div class="next-top"><span class="kicker quiet"><i class="dot"></i>Calls</span></div><div class="next-title">No calendar yet</div><div class="next-meta">Your calls appear after the morning refresh.</div></div>`;
  const ev=todayEvents(c,today);
  const cur=ev.find(e=>{const s=toMin(e.start),en=toMin(e.end);return s!=null&&s<=nowMin&&(en==null||en>nowMin)});
  const nxt=ev.find(e=>{const s=toMin(e.start);return s!=null&&s>nowMin});
  const meta=e=>[e.start&&(e.start+(e.end?'–'+e.end:'')),e.who].filter(Boolean).map(esc).join(' · ');
  if(cur){
    const s=toMin(cur.start),en=toMin(cur.end);const pct=en>s?Math.round((nowMin-s)/(en-s)*100):0;
    return `<div class="card next"><div class="next-top"><span class="kicker live"><i class="dot"></i>Now</span>${en!=null?`<span class="when">ends in ${esc(dur(Math.max(1,en-nowMin)))}</span>`:''}</div>
      <div class="next-title">${esc(cur.title||'Untitled')}</div><div class="next-meta">${meta(cur)}</div>
      <div class="progress"><span data-pct="${Math.max(0,Math.min(100,pct))}"></span></div>
      ${nxt?`<div class="then">Then <b>${esc(nxt.start)}</b> · ${esc(nxt.title||'')}</div>`:''}</div>`;
  }
  if(nxt){
    const d=toMin(nxt.start)-nowMin;
    return `<div class="card next"><div class="next-top"><span class="kicker"><i class="dot"></i>Up next</span><span class="when">${d<=1?'starting now':'in '+esc(dur(d))}</span></div>
      <div class="next-title">${esc(nxt.title||'Untitled')}</div><div class="next-meta">${meta(nxt)}</div></div>`;
  }
  const later=laterDays(c,today)[0];
  if(later){
    const e=later.events[0];
    return `<div class="card next"><div class="next-top"><span class="kicker"><i class="dot"></i>Next call</span><span class="when">${esc(dayShort(later))} ${esc(e.start||'')}</span></div>
      <div class="next-title">${esc(e.title||'Untitled')}</div><div class="next-meta">${esc(e.who||'')}</div>
      <div class="then">${ev.length?'No more calls today':'No calls today'}</div></div>`;
  }
  return `<div class="card next"><div class="next-top"><span class="kicker quiet"><i class="dot"></i>Calls</span></div><div class="next-title">Nothing scheduled</div><div class="next-meta">No calls through Sunday.</div></div>`;
}

function stats(g,c,today,nowMin){
  const tile=(icon,n,lbl,loaded,act)=>{
    const inner=`<span class="ico">${svg(icon)}</span>${loaded?`<div class="num">${esc(n)}</div>`:'<span class="skel num"></span>'}<div class="lbl">${esc(lbl)}</div>`;
    return loaded&&act?`<button class="card stat" ${act}><span class="go" aria-hidden="true">${svg('right')}</span>${inner}</button>`:`<div class="card stat">${inner}</div>`;
  };
  const o=state.outlook;
  const need=(g||o)?arr(g&&g.needYou).length+arr(o&&o.needYou).length:'–';
  const left=c?todayEvents(c,today).filter(e=>isLeft(e,nowMin)).length:'–';
  const week=c?(c.days||[]).filter(d=>d.date>=today).reduce((n,d)=>n+((d.events||[]).length),0):'–';
  return tile('alertc',need,'Need you',LD.gmail&&LD.outlook,`data-open="needs" aria-label="${esc(need)} need you: show them"`)
    +tile('video',left,'Calls left',LD.calendar&&c,`data-go="calls" aria-label="${esc(left)} calls left today: open Calls"`)
    +tile('cal',week,'This week',LD.calendar&&c,`data-go="calls" aria-label="${esc(week)} calls this week: open Calls"`);
}

function callRow(e,isToday,nowMin){
  const s=toMin(e.start),en=toMin(e.end);
  const past=isToday&&en!=null&&en<=nowMin;
  const now=isToday&&s!=null&&s<=nowMin&&(en==null||en>nowMin);
  const cls=['call',past&&'past',now&&'now',e.tentative&&'tent'].filter(Boolean).join(' ');
  const flags=(now?'<span class="badge now">Now</span>':'')+(e.tentative?'<span class="badge tent">Tentative</span>':'');
  return `<div class="${cls}"><div class="c-time">${esc(e.start||'')}${e.end?`<small>${esc(e.end)}</small>`:''}</div><div class="c-bar"></div>
    <div><div class="c-title">${esc(e.title||'Untitled')}</div>${e.who?`<div class="c-who">${esc(e.who)}</div>`:''}${flags?`<div class="c-flags">${flags}</div>`:''}
    ${e.overlapsWith?`<div class="overlap">${svg('warn')}Overlaps with ${esc(e.overlapsWith)}</div>`:''}</div></div>`;
}
function todaySection(c,today,nowMin,nowHM){
  let body;
  if(!LD.calendar)body=skelRows(3);
  else if(!c)body=empty('Your calls appear here after the morning refresh.');
  else{
    const ev=todayEvents(c,today);
    if(!ev.length)body=calm('No calls today');
    else{
      const line=`<div class="nowline" aria-label="Now ${esc(nowHM)}"><b>${esc(nowHM)}</b><i></i></div>`;
      let rows='',placed=false;
      ev.forEach(e=>{const s=toMin(e.start);if(!placed&&s!=null&&s>nowMin){rows+=line;placed=true}rows+=callRow(e,true,nowMin)});
      if(!placed)rows+=line;
      body=`<div class="card">${rows}</div>`;
    }
  }
  return sec('Today',stamp(c,'Updated'),body);
}
function weekSection(c,today){
  if(!LD.calendar||!c)return '';
  const days=laterDays(c,today);
  const body=days.length?days.map((d,i)=>`<div class="day-h${i?'':' first'}">${esc(d.label||d.date)}</div><div class="card">${d.events.map(e=>callRow(e,false)).join('')}</div>`).join(''):empty('Nothing else through Sunday.');
  return sec('Later this week','',body);
}

function mailRow(x,icon,strong,account){
  const meta=[x.sender,x.time].filter(Boolean).map(esc).join(' · ');
  const u=safeUrl(x.url);const sub=x.action||x.why;
  return `<div class="row"><span class="tile${strong?' strong':''}">${svg(icon)}</span><div>
    <div class="r-title">${esc(x.title||'')}</div>${sub?`<div class="r-sub">${esc(sub)}</div>`:''}
    ${x.deadline?`<div class="deadline">${svg('clock')}<span>${esc(x.deadline)}</span></div>`:''}
    ${(meta||x.source)?`<div class="r-meta">${x.source?`<span class="badge">${esc(x.source)}</span>`:''}${meta?`<span>${meta}</span>`:''}</div>`:''}</div>
    ${u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer" aria-label="Open in ${esc(account||'mail')}: ${esc(x.title||'')}">Open${svg('arrow')}</a>`:'<span></span>'}</div>`;
}
/* One block per inbox: Work (Outlook) and Personal (Gmail) */
function inboxBlock(doc,loaded,title,account,emptyMsg,key){
  const closed=!!collapsed[key];
  const counts=()=>{
    if(!loaded)return '';if(!doc)return 'nothing yet';
    const n=arr(doc.needYou).length,w=arr(doc.worthLook).length,r=arr(doc.worthReading).length;
    const bits=[n?`<b>${n} need${n===1?'s':''} you</b>`:'nothing needs you'];if(w)bits.push(`${w} to look at`);if(r)bits.push(`${r} to read`);
    return bits.join(' · ');
  };
  const block=(right,body)=>`<section class="sec ib${closed?' closed':''}" data-ib="${key}"><div class="sec-h">
    <h2 class="ib-head"><button class="ib-toggle" aria-expanded="${!closed}" aria-controls="ib-${key}">${svg('chev').replace('class="i"','class="i chev"')}<span>${esc(title)}</span><span class="acct">${esc(account)}</span><span class="ib-sum">${counts()}</span></button></h2>${right||''}</div>
    <div class="ib-body" id="ib-${key}"><div class="ib-in">${body}</div></div></section>`;
  if(!loaded)return block('',skelRows(2));
  if(!doc)return block('',empty(emptyMsg));
  const n=arr(doc.needYou),w=arr(doc.worthLook),r=arr(doc.worthReading),s=arr(doc.skipped);
  const grp=t=>`<div class="grp">${esc(t)}</div>`;
  let h=n.length?grp('Needs you')+n.map(x=>mailRow(x,'exclaim',true,account)).join('')
    :`<div class="row calm"><span class="tile">${svg('check')}</span><div class="r-title">Nothing needs you</div><span></span></div>`;
  if(w.length)h+=grp('Worth a look')+w.map(x=>mailRow(x,'eye',false,account)).join('');
  if(r.length)h+=grp('Worth reading')+r.map(x=>mailRow(x,'book',false,account)).join('');
  if(s.length){const total=s.reduce((a,x)=>a+(+x.count||0),0);
    h+=grp(`Skipped · ${total}`)+`<div class="chips">${s.map(x=>`<span class="chip"><b>${esc(x.count)}</b>${esc(x.label)}</span>`).join('')}</div>`}
  return block(stamp(doc,'Updated'),`<div class="card">${h}</div>`);
}

function render(){
  const now=new Date(),today=ymd(now),nowHM=hm(now),nowMin=toMin(nowHM);
  const sc=B.sceneAt(now);if(sc!==root.getAttribute('data-scene'))applyScene(sc);
  const g=state.gmail,c=state.calendar;
  LD={gmail:ready&&state.loaded.gmail,outlook:ready&&state.loaded.outlook,calendar:ready&&state.loaded.calendar};
  const S={
    today:()=>todaySection(c,today,nowMin,nowHM),
    week:()=>weekSection(c,today),
    work:()=>inboxBlock(state.outlook,LD.outlook,IB.work.label,IB.work.account,`Your ${IB.work.account} inbox appears here after the morning refresh.`,'work'),
    personal:()=>inboxBlock(g,LD.gmail,IB.personal.label,IB.personal.account,`Your ${IB.personal.account} digest appears here after the morning refresh.`,'personal')
  };
  const wide=mqWide.matches;
  const layouts={
    overview:wide?[['today','week'],['work','personal']]:[['work','today','personal','week']],
    calls:wide?[['today'],['week']]:[['today','week']],
    inbox:wide?[['work'],['personal']]:[['work','personal']]
  };
  let html=hero(g,c,today,nowMin,now,nowHM)+banner(g,c);
  if(state.view==='data'){html+=dataView()}
  else{
    const L=(layouts[state.view]||layouts.overview).map(col=>col.filter(k=>IB[k]!==null)).filter(col=>col.length);
    html+=`<div class="top">${nextWidget(c,today,nowMin)}${stats(g,c,today,nowMin)}</div>`;
    const cols=L.map(col=>col.map(k=>S[k]()).join(''));
    html+=L.length>1?`<div class="cols">${cols.map(x=>`<div>${x}</div>`).join('')}</div>`:cols[0];
  }
  html+=`<p class="foot">${state.demo?'Example data. Set it up in Claude to see your own.':'Refreshes automatically every morning'}</p>`;
  if(html!==lastHTML){
    main.classList.toggle('anim',animateNext);
    main.innerHTML=html;lastHTML=html;
    if(animateNext){let i=0;main.querySelectorAll('.hero-h,.card,.sec-h,.day-h').forEach(el=>{el.style.animationDelay=Math.min(i++,14)*28+'ms'})}
    animateNext=false;
    main.querySelectorAll('[data-pct]').forEach(el=>{el.style.width=el.dataset.pct+'%'});
  }
  const sum=main.querySelector('.summary');
  document.getElementById('sr').textContent='Daily brief. '+(sum?sum.textContent:'');
  if(sheetOpen)fillSheet();
}

/* Data view: the three raw entries in the page's database, as the morning task wrote them */
function hlJSON(json){
  return esc(json).replace(/(&quot;(?:(?!&quot;).)*&quot;(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?)/g,m=>{
    const c=m.startsWith('&quot;')?(/:$/.test(m)?'k':'s'):'n';return `<span class="${c}">${m}</span>`;});
}
function dataView(){
  const shortUrl=(k,v)=>typeof v==='string'&&/^https?:/.test(v)&&v.length>64?v.slice(0,60)+'…':v;
  const cards=['outlook','gmail','calendar'].map(k=>{
    const d=state[k];const loaded=LD[k];
    const head=`<div class="dv-h"><code>brief/${k}</code>${d?stamp(d,'Written'):''}${d?`<button class="btn dv-copy" data-k="${k}">Copy</button>`:''}</div>`;
    const body=!loaded?'<div class="dv-empty"><span class="skel w80"></span><span class="skel w60"></span></div>'
      :d?`<pre class="dv-json">${hlJSON(JSON.stringify(d,shortUrl,2))}</pre>`:'<div class="dv-empty">Empty until the next morning refresh writes it.</div>';
    return `<div class="card">${head}${body}</div>`;
  }).join('');
  return sec('Database',`<span class="stamp">collection brief · 3 entries</span>`,`<div class="dv">${cards}</div>`);
}
/* Needs-you sheet: everything waiting on you, from both inboxes, with a way into each email */
const sheet=document.getElementById('sheet'),sheetB=document.getElementById('sheet-b'),sheetT=document.getElementById('sheet-t');
function fillSheet(){
  const src=[IB.work&&[IB.work.label,IB.work.account,state.outlook,LD.outlook],IB.personal&&[IB.personal.label,IB.personal.account,state.gmail,LD.gmail]].filter(Boolean);

      :n.length?n.map(x=>mailRow(x,'exclaim',true,acct)).join('')

function openSheet(from){
  if(sheetOpen)return;

}
function closeSheet(){

sheet.addEventListener('click',e=>{

sheet.addEventListener('keydown',e=>{

/* On the phone the sheet can be swiped down to close, like a native sheet */
(()=>{
  const panel=sheet.querySelector('.sheet'),scrim=sheet.querySelector('.sheet-scrim'),wideSheet=matchMedia('(min-width:900px)');
  let on=false,moved=false,y0=0,dy=0,lastY=0,lastT=0,v=0;
  const reset=()=>{panel.style.transition=panel.style.transform=scrim.style.transition=scrim.style.opacity=''};
  panel.addEventListener('touchstart',e=>{
    if(wideSheet.matches||e.touches.length!==1)return;
    if(e.target.closest('.sheet-b')&&sheetB.scrollTop>0)return;      // the list scrolls back up first
    on=true;moved=false;dy=v=0;y0=lastY=e.touches[0].clientY;lastT=e.timeStamp;
  },{passive:true});
  panel.addEventListener('touchmove',e=>{
    if(!on)return;
    const y=e.touches[0].clientY,d=y-y0;
    if(!moved){if(Math.abs(d)<6)return;if(d<0){on=false;return}moved=true;panel.style.transition=scrim.style.transition='none'}
    e.preventDefault();
    dy=Math.max(0,d);const dt=e.timeStamp-lastT;if(dt>0)v=(y-lastY)/dt;lastY=y;lastT=e.timeStamp;
    panel.style.transform=`translateY(${dy}px)`;scrim.style.opacity=String(Math.max(0,1-dy/(panel.offsetHeight||1)));
  },{passive:false});
  const end=()=>{
    if(!on)return;on=false;if(!moved)return;moved=false;
    reset();if(dy>110||(dy>30&&v>.5))closeSheet();                  // otherwise it springs back
  };
  panel.addEventListener('touchend',end);panel.addEventListener('touchcancel',end);
})();
main.addEventListener('click',e=>{

      const shift=d=>{const [y,m,dd]=d.split('-').map(Number),[y0,m0,d0]=day0.split('-').map(Number),[y1,m1,d1]=today.split('-').map(Number);
        const t=new Date(Date.UTC(y,m-1,dd)+(Date.UTC(y1,m1-1,d1)-Date.UTC(y0,m0-1,d0)));return t.toISOString().slice(0,10)};
      const stamp=new Date(Date.now()-36e5).toISOString();
      for(const k of ['gmail','outlook','calendar']){const d=JSON.parse(JSON.stringify(demo['brief/'+k]));d.date=today;d.generatedAt=stamp;
        if(d.days)d.days.forEach((x,i)=>{x.date=shift(x.date);const L=fLong.format(new Date(x.date+'T12:00:00Z'));x.label=i===0?'Today · '+L:L});
        state[k]=d;state.loaded[k]=true}
      state.demo=true;maybeReady();render();return;
    }catch(e){}
    state.error='Sign in to claude.ai to see your brief.';maybeReady();render();return
  }
  const fresh={gmail:false,outlook:false,calendar:false};
  const timer=setTimeout(()=>{state.timedOut=true;maybeReady();render()},10000);
  const sub=k=>db.doc('brief/'+k).onSnapshot(s=>{
    state[k]=s.exists?s.data():null;state.loaded[k]=true;
    if(!s.metadata.fromCache){fresh[k]=true;if(fresh.gmail&&fresh.outlook&&fresh.calendar){clearTimeout(timer);state.timedOut=false}}
    maybeReady();render();
  },()=>{state.loaded[k]=true;state.error='Your brief couldn’t be loaded on this visit.';clearTimeout(timer);maybeReady();render()});
  sub('gmail');sub('outlook');sub('calendar');
})();
</script>
